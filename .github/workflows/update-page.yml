name: Update dashboard page

# 每交易日自动：拉取中证官网最新行情 → 重建 index.html → 提交回本仓库。
# 数据源就在本仓库 data/ 下，不再依赖任何外部仓库。
# 两次 cron 分别对应中证官网数据发布后的两个时点（北京时间 20:35 / 23:15）。
on:
  schedule:
    - cron: '35 12 * * 1-5'   # UTC 12:35 = 北京 20:35
    - cron: '15 15 * * 1-5'   # UTC 15:15 = 北京 23:15
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pandas numpy

      # 先更新行情（只追加，不改历史），再重建页面
      - name: Update market data
        run: python update_data.py

      - name: Build page
        run: python build_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/H20269历史数据.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(page): auto rebuild $(date -u -d '+8 hours' '+%Y-%m-%d')"
            git push
          fi
